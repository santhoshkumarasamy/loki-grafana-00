deploymentMode: SimpleScalable

loki:
  auth_enabled: false

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h

  storage:
    type: s3

    bucketNames:
      chunks: loki-test-bucket-sk
      ruler: loki-test-bucket-sk

    s3:
      region: us-east-1
      s3ForcePathStyle: false
      endpoint: https://s3.us-east-1.amazonaws.com
    prefix: loki/

  limits_config:
    retention_period: 168h
    allow_structured_metadata: true
    volume_enabled: true

  compactor:
    retention_enabled: true
    delete_request_store: s3

  querier:
    max_concurrent: 4

  pattern_ingester:
    enabled: true

read:
  replicas: 1

write:
  replicas: 1

backend:
  replicas: 1

gateway:
  enabled: true

minio:
  enabled: false

global:
  extraEnv:
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: loki-s3-credentials
          key: AWS_ACCESS_KEY_ID
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: loki-s3-credentials
          key: AWS_SECRET_ACCESS_KEY
